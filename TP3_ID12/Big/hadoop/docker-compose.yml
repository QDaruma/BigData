# Cluster HDFS minimal : un NameNode (l'annuaire) et un DataNode (le stockage).
# Les ports sont ouverts pour que Spark, lancé sous Windows, lise et écrive dans HDFS.
name: tp-bigdata-ml
services:
  namenode:
    image: apache/hadoop:3.4.1
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870", "8020:8020"]
    env_file: ./config
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ../data:/data
  datanode:
    image: apache/hadoop:3.4.1
    command: ["hdfs", "datanode"]
    ports: ["9864:9864", "9866:9866"]
    env_file: ./config
    environment:
      # Le DataNode se présente sous le nom "localhost" : Spark (sous Windows) le joint par le port 9866 ouvert.
      HDFS-SITE.XML_dfs.datanode.hostname: "localhost"
    depends_on: [namenode]
